name: History backfill (runs daily until complete)

on:
  schedule:
    - cron: "0 21 * * *"     # daily 21:00 UTC = 2:30 AM IST (no-op once everything is filled)
  workflow_dispatch:
    inputs:
      budget_min:
        description: "Minutes to spend downloading"
        default: "200"

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Backfill
        env:
          BUDGET_MIN: ${{ github.event.inputs.budget_min || '200' }}
        run: python -m alphagen.backfill
      - name: Save data to the repo
        if: always()
        run: |
          git config user.name "alphagen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Backfill $(date -u +%Y-%m-%d)" || echo "Nothing new to save"
          git pull --rebase -X ours || true
          git push
