name: Weekly data collection

on:
  schedule:
    - cron: "30 14 * * 5"   # every Friday 14:30 UTC = 8:00 PM IST
  workflow_dispatch:         # adds a "Run workflow" button for manual runs
    inputs:
      max_tickers:
        description: "Limit stocks for a quick test (0 = all)"
        default: "0"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect data
        env:
          MAX_TICKERS: ${{ github.event.inputs.max_tickers || '0' }}
        run: python -m alphagen.run_all

      - name: Save data to the repo
        if: always()
        run: |
          git config user.name "alphagen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Data update $(date -u +%Y-%m-%d)" || echo "Nothing new to save"
          git push
